<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaT System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-active-key="">
  <div class="app">
    <aside class="sidebar">
      <a href="/index.html" class="sidebar-logo">
        <div class="logo-circle">W</div>
        <div class="logo-text">WaT<br>System</div>
      </a>
      <a id="order-create-btn" class="btn-order-create"
         href="/pages/placeholder.html?key=order-create&title=発注する">📦 発注する</a>

  <script src="/js/nav-data.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('key') || '';
    const title = params.get('title') || 'ページ';
    document.body.dataset.activeKey = key;
    document.getElementById('placeholder-title').textContent = title;
    document.title = `WaT System - ${title}`;
